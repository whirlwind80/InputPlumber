# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: CompositeDevice

# Name of the composite device mapping
name: Zotac Zone

# Only allow a single source device per composite device of this type.
single_source: false

# Only use this profile if *any* of the given matches matches. If this list is
# empty, then the source devices will *always* be checked.
# /sys/class/dmi/id/product_name
matches:
  - dmi_data:
      board_name: "{G0A1W,G1A1W}"
      sys_vendor: ZOTAC

# One or more source devices to combine into a single virtual device. The events
# from these devices will be watched and translated according to the key map.
source_devices:
  - group: gamepad # Used for setting attributes on load
    hidraw:
      vendor_id: 0x1ee9
      product_id: 0x1590
      interface_num: 3
    unique: false
  - group: gamepad
    evdev:
      name: "{ZOTAC Gaming Zone Gamepad,Zotac Technology Limited ZOTAC GAMING ZONE}"
      vendor_id: "1ee9"
      product_id: "1590"
      handler: event*
    capability_map_id: zone1
    unique: false
    # This entry deliberately carries no phys_path. It used to pin */input1,
    # back when it was the only thing stopping a second composite device from
    # being spawned; `unique: false` now covers that, and the name glob is a
    # whole-string match (glob_match in has_matching_evdev) that resolves to the
    # vendor driver's own gamepad node and nothing else on this hardware.
    # Dropping the constraint also lets the entry find that node on machines
    # where the vendor driver enumerates it on a different interface - one such
    # report exists (*/input3), which did not reproduce here.
    # NOTE: with the zotac_zone_hid vendor driver bound, this node *declares* a
    # full gamepad capability set but never actually emits button/axis events
    # (verified with evtest 2026-09-08: pressing ABXY produces nothing here).
    # The real gamepad stream is the kernel xpad node below. This entry is still
    # worth keeping: force-feedback effect upload does succeed on this node.
    # Belt and braces: this node declares BTN_TRIGGER_HAPPY5/6, which the
    # built-in evdev mapping hard-codes to the same RightPaddle1/2 capability
    # the keyboard source's KEY_END rule produces, and composite-device
    # press-state tracking is keyed by capability with no per-source
    # disambiguation. Since this node was measured to emit nothing at all the
    # collision cannot currently fire, but excluding it here costs nothing and
    # keeps the real paddle path (keyboard entry) as the only producer.
    events:
      exclude:
        - "Gamepad:Button:RightPaddle1"
        - "Gamepad:Button:RightPaddle2"
  # The kernel xpad node on USB interface 0. This is where the real gamepad
  # input (ABXY, sticks, triggers, D-pad, shoulders) actually comes from, both
  # with and without the zotac_zone_hid vendor driver loaded — the vendor
  # driver's own "Gamepad" node above declares those capabilities but never
  # emits them. Without this entry the virtual target gets no standard buttons
  # at all and Steam picks this node up as a second, raw controller.
  - group: gamepad
    evdev:
      name: ZOTAC Gaming Zone
      vendor_id: "1ee9"
      product_id: "1590"
      phys_path: "*/input0"
      handler: event*
    unique: false
  - group: keyboard
    evdev:
      name: "{ZOTAC Gaming Zone Keyboard,Zotac Technology Limited ZOTAC GAMING ZONE Keyboard}"
      vendor_id: "1ee9"
      product_id: "1590"
      handler: event*
    capability_map_id: zone1
    unique: false
  # TODO: Reevaluate if new firmware with ABS mode is added.
  #- group: mouse
  #  evdev:
  #    name: ZOTAC Gaming Zone Mouse
  #    vendor_id: "1ee9"
  #    product_id: "1590"
  #    handler: event*
  # Removed per pastaq's PR #664 review suggestion: this evdev node carries no
  # buttons, only pointer motion and a scroll wheel, so nothing needs grabbing
  # here — verified on hardware that both still work natively when ungrabbed.
  #- group: mouse
  #  evdev:
  #    name: "{ZOTAC Gaming Zone Mouse,Zotac Technology Limited ZOTAC GAMING ZONE Mouse}"
  #    vendor_id: "1ee9"
  #    product_id: "1590"
  #    handler: event*
  # With the zotac_zone_hid vendor driver bound, the physical dials show up as
  # their own dedicated evdev device (separate from the touchpad above) — grab
  # it and translate via zone1's Left/Right Dial mapping. Must NOT share a name
  # glob with the touchpad/Mouse entry above (see CLAUDE.md dial notes).
  - group: mouse
    evdev:
      name: "{ZOTAC Gaming Zone Dials,Zotac Technology Limited ZOTAC GAMING ZONE Dials}"
      vendor_id: "1ee9"
      product_id: "1590"
      handler: event*
    capability_map_id: zone1
    unique: false
  - group: imu
    iio:
      name: "{i2c-BMI0160:00,bmi260}"
      mount_matrix:
        x: [0, -1, 0]
        y: [-1, 0, 0]
        z: [0, 0, -1]
    unique: false

  #RGB
  - group: led
    udev:
      sys_name: zotac:rgb:spectra_zone_0
      subsystem: leds
    unique: false
  - group: led
    udev:
      sys_name: zotac:rgb:spectra_zone_1
      subsystem: leds
    unique: false

# Optional configuration for the composite device
options:
  # If true, InputPlumber will automatically try to manage the input device. If
  # this is false, InputPlumber will not try to manage the device unless an
  # external service enables management of the device. Defaults to 'false'
  auto_manage: true

# The target input device(s) to emulate by default
target_devices:
  - xbox-elite
  - mouse
  - keyboard
