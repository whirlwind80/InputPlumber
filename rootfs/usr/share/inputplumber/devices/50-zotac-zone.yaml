# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: CompositeDevice

# Name of the composite device mapping
name: Zotac Zone

# Only allow a single source device per composite device of this type.
single_source: false

# Only use this profile if *any* of the given matches matches. If this list is
# empty, then the source devices will *always* be checked.
# /sys/class/dmi/id/product_name
matches:
  - dmi_data:
      board_name: "{G0A1W,G1A1W}"
      sys_vendor: ZOTAC

# One or more source devices to combine into a single virtual device. The events
# from these devices will be watched and translated according to the key map.
source_devices:
  - group: gamepad # Used for setting attributes on load
    hidraw:
      vendor_id: 0x1ee9
      product_id: 0x1590
      interface_num: 3
    unique: false
  # The vendor driver's own gamepad node. It declares a full gamepad but never
  # emits one; kept because force-feedback upload works here. Matched by name
  # only, so it is also found where the driver enumerates it on another
  # interface.
  - group: gamepad
    evdev:
      name: "{ZOTAC Gaming Zone Gamepad,Zotac Technology Limited ZOTAC GAMING ZONE}"
      vendor_id: "1ee9"
      product_id: "1590"
      handler: event*
    capability_map_id: zone1
    unique: false
    # BTN_TRIGGER_HAPPY5/6 on this node hard-map to the same RightPaddle1/2 the
    # keyboard entry produces from KEY_HOME/KEY_END, and press state is tracked
    # per capability, not per source. Excluded so the keyboard path is the only
    # producer.
    events:
      exclude:
        - "Gamepad:Button:RightPaddle1"
        - "Gamepad:Button:RightPaddle2"
  # The kernel xpad node, where the real ABXY, sticks, triggers, D-pad and
  # shoulders come from, with or without the vendor driver. Without this entry
  # the virtual controller has no standard buttons and Steam picks this node up
  # as a second, raw controller. Drop the phys_path pin first if a unit
  # enumerates xpad on another interface.
  - group: gamepad
    evdev:
      name: ZOTAC Gaming Zone
      vendor_id: "1ee9"
      product_id: "1590"
      phys_path: "*/input0"
      handler: event*
    unique: false
  - group: keyboard
    evdev:
      name: "{ZOTAC Gaming Zone Keyboard,Zotac Technology Limited ZOTAC GAMING ZONE Keyboard}"
      vendor_id: "1ee9"
      product_id: "1590"
      handler: event*
    capability_map_id: zone1
    unique: false
  # TODO: Reevaluate if new firmware with ABS mode is added.
  #- group: mouse
  #  evdev:
  #    name: ZOTAC Gaming Zone Mouse
  #    vendor_id: "1ee9"
  #    product_id: "1590"
  #    handler: event*
  # Left ungrabbed on purpose: it carries no buttons, and both pointer motion
  # and scroll work natively.

  # The physical dials, a dedicated node separate from the touchpad above. The
  # name glob must never also match the Mouse node.
  - group: mouse
    evdev:
      name: "{ZOTAC Gaming Zone Dials,Zotac Technology Limited ZOTAC GAMING ZONE Dials}"
      vendor_id: "1ee9"
      product_id: "1590"
      handler: event*
    capability_map_id: zone1
    unique: false
  - group: imu
    iio:
      name: "{i2c-BMI0160:00,bmi260}"
      mount_matrix:
        x: [0, -1, 0]
        y: [-1, 0, 0]
        z: [0, 0, -1]
    unique: false

  #RGB
  - group: led
    udev:
      sys_name: zotac:rgb:spectra_zone_0
      subsystem: leds
    unique: false
  - group: led
    udev:
      sys_name: zotac:rgb:spectra_zone_1
      subsystem: leds
    unique: false

# Optional configuration for the composite device
options:
  # If true, InputPlumber will automatically try to manage the input device. If
  # this is false, InputPlumber will not try to manage the device unless an
  # external service enables management of the device. Defaults to 'false'
  auto_manage: true

# The target input device(s) to emulate by default
target_devices:
  - xbox-elite
  - mouse
  - keyboard
